# Excitement score v4: one score, weights fitted to the Fight / Performance
# of the Night bonuses (regenerate with `blindcard-ingest fit-scoring`; do not edit).
# Fitted on events before 2024, checked on the rest; shipped weights
# are refitted on all labelled fights. Held-out numbers for this fit:
#   Fight of the Night AUC 0.721, in the top 3 of its card 55%, Performance of the Night AUC 0.802
#   AUC of the stars for 'was finished' 0.877 (0.5 = no information)
#   shipped weights, all labelled fights: AUC for 'finished' 0.886
# The score is 50.0% Fight of the Night fit and 50.0%
# Performance of the Night fit: the largest share of the second that keeps
# AUC(stars -> finished) within 0.4 of neutral on the training years.
# A finish adds to a fight's score and never subtracts from it.

version = 4
description = "Fitted to the Fight/Performance of the Night bonuses: one score."

[normalisation]
cap_quantile = 0.99
min_pool_size = 100

# composite = sum(weight * normalised_feature). Negative weights penalise.
[weights]
pace                    = 0.506   # combined significant strikes landed per minute
knockdowns              = 0.481   # total knockdowns
sub_attempts            = 0.25    # total submission attempts
reversals               = 0.359   # total reversals
swings                  = 0.47    # round-to-round lead changes
competitiveness         = 0.145   # 1 - |A - B| / (A + B) on significant strikes landed
close_decision          = -0.082  # split or majority decision
finish                  = 0.557   # ended by KO/TKO or submission (adds, never subtracts)
control_share_nofinish  = -0.199  # share of the fight under control, when it did not end in a finish
knockdowns_both         = 0.243   # both fighters scored a knockdown
min_pace                = 1.0     # significant strikes per minute of the less active fighter
takedown_rate           = 0.038   # takedowns landed per minute, both fighters
early_finish            = 0.23    # how early a finish came (1 - share of the scheduled time used)
main_event              = 0.767   # the main event of the card
co_main                 = 0.483   # the co-main event
title_fight             = 0.224   # a championship bout

# Percentile (0-100) -> stars, same curve as v1.
[stars]
thresholds = [
    [0, 1.0],
    [8, 1.5],
    [16, 2.0],
    [28, 2.5],
    [40, 3.0],
    [55, 3.5],
    [70, 4.0],
    [85, 4.5],
    [97, 5.0],
]
