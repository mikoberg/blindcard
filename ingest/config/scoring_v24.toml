# Excitement score v24: one score, weights fitted to the Fight / Performance
# of the Night bonuses (regenerate with `blindcard-ingest fit-scoring`; do not edit).
# Fitted on events before 2024, checked on the rest; shipped weights
# are refitted on all labelled fights. Held-out numbers for this fit:
#   Fight of the Night AUC 0.778, in the top 3 of its card 60%, Performance of the Night AUC 0.749
#   AUC of the stars for 'was finished' 0.782 (0.5 = no information)
#   shipped weights, all labelled fights: AUC for 'finished' 0.792
# The score is 60.0% Fight of the Night fit and 40.0%
# Performance of the Night fit: the largest share of the second that keeps
# AUC(stars -> finished) within 0.3 of neutral on the training years.
# A finish adds to a fight's score and never subtracts from it.
# Set by hand, not fitted: cut_short -0.6.

version = 24
description = "Fitted to the Fight/Performance of the Night bonuses: one score."

[normalisation]
cap_quantile = 0.99
min_pool_size = 100
# Compared with fights of their own era (strikes per minute grew over the years):
era_adjusted = ["pace", "min_pace", "min_pace_nofinish", "volume_nofinish"]

# composite = sum(weight * normalised_feature). Negative weights penalise.
[weights]
pace                    = 1.0     # combined significant strikes landed per minute
knockdowns              = 0.63    # total knockdowns
sub_attempts            = 0.256   # total submission attempts
reversals               = 0.398   # total reversals
swings                  = 0.451   # round-to-round lead changes
competitiveness         = 0.408   # 1 - |A - B| / (A + B) on significant strikes landed
real_finish             = 0.801   # ended by KO/TKO or submission, not by an injury (adds, never subtracts)
control_stalling        = -0.411  # share under control, no finish, waived by grappling action
knockdowns_both         = 0.309   # both fighters scored a knockdown
min_pace_nofinish       = 0.344   # strikes per minute of the less active fighter, when no real finish came
takedown_rate           = 0.089   # takedowns landed per minute, both fighters
real_early_finish       = 0.182   # how early a real finish came (1 - share of the scheduled time used)
main_event              = 0.2     # the main event of the card
co_main                 = 0.2     # the co-main event
volume_nofinish         = 0.839   # significant strikes landed over a fight that did not end in a finish
five_rounds             = 0.188   # scheduled for five rounds
rematch                 = 0.032   # the two fighters have met before
streak                  = 0.265   # the two fighters' current win streaks, added
star_power              = 0.121   # their earlier main events and title fights, added
unbeaten_fighter        = 0.15    # at least one of them has no UFC loss
experience              = 0.039   # UFC fights of the less experienced of the two
cut_short               = -0.6    # share of the scheduled time not fought, if an injury or CNC ended it

# Percentile (0-100) -> stars, same curve as v1.
[stars]
classic_min_seconds = 120  # shorter fights top out one level lower
thresholds = [
    [0, 1.0],
    [8, 1.5],
    [16, 2.0],
    [28, 2.5],
    [40, 3.0],
    [55, 3.5],
    [70, 4.0],
    [85, 4.5],
    [99, 5.0],
]
