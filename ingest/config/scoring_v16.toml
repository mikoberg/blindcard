# Excitement score v16: one score, weights fitted to the Fight / Performance
# of the Night bonuses (regenerate with `blindcard-ingest fit-scoring`; do not edit).
# Fitted on events before 2024, checked on the rest; shipped weights
# are refitted on all labelled fights. Held-out numbers for this fit:
#   Fight of the Night AUC 0.814, in the top 3 of its card 64%, Performance of the Night AUC 0.691
#   AUC of the stars for 'was finished' 0.679 (0.5 = no information)
#   shipped weights, all labelled fights: AUC for 'finished' 0.689
# The score is 65.0% Fight of the Night fit and 35.0%
# Performance of the Night fit: the largest share of the second that keeps
# AUC(stars -> finished) within 0.2 of neutral on the training years.
# A finish adds to a fight's score and never subtracts from it.
# Set by hand, not fitted: cut_short -0.6, fragile_ko -0.5.

version = 16
description = "Fitted to the Fight/Performance of the Night bonuses: one score."

[normalisation]
cap_quantile = 0.99
min_pool_size = 100
# Compared with fights of their own era (strikes per minute grew over the years):
era_adjusted = ["pace", "min_pace", "volume_nofinish"]

# composite = sum(weight * normalised_feature). Negative weights penalise.
[weights]
pace                    = 0.535   # combined significant strikes landed per minute
knockdowns              = 0.575   # total knockdowns
sub_attempts            = 0.347   # total submission attempts
reversals               = 0.475   # total reversals
swings                  = 0.455   # round-to-round lead changes
competitiveness         = 0.091   # 1 - |A - B| / (A + B) on significant strikes landed
real_finish             = 0.535   # ended by KO/TKO or submission, not by an injury (adds, never subtracts)
control_share_nofinish  = -0.332  # share of the fight under control, when it did not end in a finish
knockdowns_both         = 0.313   # both fighters scored a knockdown
min_pace                = 1.0     # significant strikes per minute of the less active fighter
takedown_rate           = 0.152   # takedowns landed per minute, both fighters
real_early_finish       = 0.157   # how early a real finish came (1 - share of the scheduled time used)
main_event              = 0.2     # the main event of the card
co_main                 = 0.2     # the co-main event
volume_nofinish         = 0.821   # significant strikes landed over a fight that did not end in a finish
five_rounds             = 0.201   # scheduled for five rounds
rematch                 = 0.028   # the two fighters have met before
streak                  = 0.234   # the two fighters' current win streaks, added
star_power              = 0.109   # their earlier main events and title fights, added
unbeaten_fighter        = 0.148   # at least one of them has no UFC loss
experience              = 0.063   # UFC fights of the less experienced of the two
cut_short               = -0.6    # share of the scheduled time not fought, if an injury or CNC ended it
fragile_ko              = -0.5    # KO/TKO, times how far the more fragile fighter's KO losses exceed the usual

# Percentile (0-100) -> stars, same curve as v1.
[stars]
thresholds = [
    [0, 1.0],
    [8, 1.5],
    [16, 2.0],
    [28, 2.5],
    [40, 3.0],
    [55, 3.5],
    [70, 4.0],
    [85, 4.5],
    [97, 5.0],
]
