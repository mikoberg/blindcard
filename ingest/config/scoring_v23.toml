# Excitement score v23 = v22 with ONE hand-made change (no refit): time under control only counts
# against a fight in proportion to how little grappling action there was. The old feature
# control_share_nofinish (weight -0.36) is replaced by control_stalling = that share x (1 - min(1,
# (submission attempts + reversals) / 5)), with the same weight. A fight with five or more
# submission attempts and reversals is a grappling fight, not stalling. On the labelled fights the
# Fight of the Night AUC goes from 0.8031 to 0.8075, and active grappling fights (control >= 60% and
# 5+ actions) had 5 Fight of the Night bonuses where their v22 stars expected 2.8. Details and the
# caveats (small group, bonuses favour striking) in docs/PREDICTIONS.md.
#
# The text below is v22's, still true for every weight except the one named above.
# Excitement score v22: one score, weights fitted to the Fight / Performance
# of the Night bonuses (regenerate with `blindcard-ingest fit-scoring`; do not edit).
# Fitted on events before 2024, checked on the rest; shipped weights
# are refitted on all labelled fights. Held-out numbers for this fit:
#   Fight of the Night AUC 0.795, in the top 3 of its card 62%, Performance of the Night AUC 0.737
#   AUC of the stars for 'was finished' 0.763 (0.5 = no information)
#   shipped weights, all labelled fights: AUC for 'finished' 0.773
# The score is 60.0% Fight of the Night fit and 40.0%
# Performance of the Night fit: the largest share of the second that keeps
# AUC(stars -> finished) within 0.3 of neutral on the training years.
# A finish adds to a fight's score and never subtracts from it.
# Set by hand, not fitted: cut_short -0.6.

version = 23
description = "v22 with the control penalty waived by grappling activity."

[normalisation]
cap_quantile = 0.99
min_pool_size = 100
# Compared with fights of their own era (strikes per minute grew over the years):
era_adjusted = ["pace", "min_pace", "volume_nofinish"]

# composite = sum(weight * normalised_feature). Negative weights penalise.
[weights]
pace                    = 0.539   # combined significant strikes landed per minute
knockdowns              = 0.613   # total knockdowns
sub_attempts            = 0.356   # total submission attempts
reversals               = 0.474   # total reversals
swings                  = 0.458   # round-to-round lead changes
competitiveness         = 0.1     # 1 - |A - B| / (A + B) on significant strikes landed
real_finish             = 0.63    # ended by KO/TKO or submission, not by an injury (adds, never subtracts)
control_stalling        = -0.36   # share under control without a finish, waived by submission attempts and reversals
knockdowns_both         = 0.3     # both fighters scored a knockdown
min_pace                = 1.0     # significant strikes per minute of the less active fighter
takedown_rate           = 0.15    # takedowns landed per minute, both fighters
real_early_finish       = 0.196   # how early a real finish came (1 - share of the scheduled time used)
main_event              = 0.2     # the main event of the card
co_main                 = 0.2     # the co-main event
volume_nofinish         = 0.829   # significant strikes landed over a fight that did not end in a finish
five_rounds             = 0.208   # scheduled for five rounds
rematch                 = 0.034   # the two fighters have met before
streak                  = 0.262   # the two fighters' current win streaks, added
star_power              = 0.116   # their earlier main events and title fights, added
unbeaten_fighter        = 0.163   # at least one of them has no UFC loss
experience              = 0.071   # UFC fights of the less experienced of the two
cut_short               = -0.6    # share of the scheduled time not fought, if an injury or CNC ended it

# Percentile (0-100) -> stars, same curve as v1.
[stars]
classic_min_seconds = 120  # shorter fights top out one level lower
thresholds = [
    [0, 1.0],
    [8, 1.5],
    [16, 2.0],
    [28, 2.5],
    [40, 3.0],
    [55, 3.5],
    [70, 4.0],
    [85, 4.5],
    [99, 5.0],
]
